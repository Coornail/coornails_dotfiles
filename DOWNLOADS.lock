# DOWNLOADS.lock — third-party release binaries fetched by `make zsh`.
#
# Unlike SOURCES.lock these artifacts are not committed to the repo: they are
# platform builds, so the repo records *what* to fetch and *what it must hash
# to* instead of carrying the bytes. `scripts/fetch-downloads.sh` installs the
# row matching the host and re-checks the installed binary; `make downloads`
# does the same without reinstalling the config files.
#
# Two hashes per row. The archive hash pins the download. The binary hash pins
# the file that actually runs, so an already-installed copy is verified without
# any network access, and a row whose archive extracts to something else fails
# instead of installing.
#
# Never hand-edit a hash to make a fetch pass. Update a row only through a
# vendor-update commit, the same rule SOURCES.lock carries.
#
# Columns, tab-separated:
#   name  target  version  url  archive_sha256  binary_sha256  install_path
